[build]
  # Install Chrome into the Netlify persistent cache dir, then build.
  # /opt/build/cache/ is preserved between deploys, so Chrome is only
  # downloaded once and reused on subsequent builds.
  command = "npx puppeteer browsers install chrome && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Skip Chromium download during `npm install` — we install it explicitly above.
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
  # Use the Netlify persistent cache directory so Chrome survives between builds.
  PUPPETEER_CACHE_DIR = "/opt/build/cache/.puppeteer"

[env.production]
  VITE_API_URL = "https://gildiyadekora.onrender.com/api"
  VITE_SITE_URL = "https://gihldihja-decora.ua"
  SITE_URL = "https://gihldihja-decora.ua"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# PrivatBank EUR rate proxy — avoids CORS when fetching from the browser
[[redirects]]
  from = "/api/eur-rate"
  to = "https://api.privatbank.ua/p24api/pubinfo?exchange&json&coursid=5"
  status = 200
  force = true

# API proxy — must be before the SPA catch-all
[[redirects]]
  from = "/api/*"
  to = "https://gildiyadekora.onrender.com/api/:splat"
  status = 200

# Prerendered routes are static directories (e.g. dist/products/index.html).
# Without an explicit rule, Netlify's default asset serving 301-redirects
# "/products" -> "/products/" before returning 200, which SEO crawlers flag
# as an unnecessary redirect hop on every internal nav link. Serving them
# directly here avoids that hop.
[[redirects]]
  from = "/products"
  to = "/products/index.html"
  status = 200
[[redirects]]
  from = "/products/orac-decor"
  to = "/products/orac-decor/index.html"
  status = 200
[[redirects]]
  from = "/gallery"
  to = "/gallery/index.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/contact/index.html"
  status = 200
[[redirects]]
  from = "/return-policy"
  to = "/return-policy/index.html"
  status = 200
[[redirects]]
  from = "/nanesennya-farby-kyiv"
  to = "/nanesennya-farby-kyiv/index.html"
  status = 200
[[redirects]]
  from = "/kupyty-lipnynu-kyiv"
  to = "/kupyty-lipnynu-kyiv/index.html"
  status = 200

# "/" and "/index.html" both served full content (200/200) reads as
# duplicate content to SEO crawlers — force index.html to the canonical root.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# SPA catch-all: every route that has no static file → serve index.html with HTTP 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
